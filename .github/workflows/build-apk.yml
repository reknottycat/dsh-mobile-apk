# Build this fork's Kotlin shell and compatible plugins over a pinned Android runtime.
# Full APK gates and injection remain in scripts/build-apk.mjs.
name: build-apk

on:
  workflow_dispatch:
    inputs:
      abi:
        description: 'Target Android ABI'
        type: choice
        options: [arm64, x86_64, both]
        default: arm64
      suffix:
        description: 'Optional test build suffix'
        type: string
        default: ''
  pull_request:
    paths:
      - 'app/**'
      - 'scripts/**'
      - 'plugins/**'
      - 'vendor/**'
      - 'dsh-*/**'
      - '.github/workflows/build-apk.yml'
      - '*.gradle.kts'
      - 'gradle/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        abi: ${{ fromJSON(inputs.abi == 'both' && '["arm64","x86_64"]' || format('["{0}"]', inputs.abi || 'arm64')) }}
    env:
      DSH_APK_DIR: ${{ github.workspace }}
      APK_SUFFIX: ${{ inputs.suffix || '' }}
      NPM_CONFIG_CACHE: ${{ runner.temp }}/dsh-npm-cache
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Android build tools
        shell: python
        run: |
          import os, subprocess
          sdkmanager = os.path.join(os.environ['ANDROID_HOME'], 'cmdline-tools/latest/bin/sdkmanager')
          subprocess.run([sdkmanager, 'platforms;android-36', 'build-tools;35.0.0', 'build-tools;36.0.0'],
                         input='y\n' * 100, text=True, check=True)
      - name: Build compatible plugins from their lockfiles
        shell: bash
        run: |
          set -euo pipefail
          for d in dsh-shell-termux dsh-client-ui-responsive plugins/dsh-android-bridge plugins/dsh-android-manage plugins/dsh-android-linux-env plugins/dsh-android-file-open plugins/dsh-model-capability plugins/dsh-android-browser plugins/dsh-android-vdisplay; do
            (cd "$d" && npm ci --no-audit --no-fund && npm run build)
          done
      - name: Verify lifecycle, profile preflight and immutable download regressions
        run: |
          (cd dsh-host-web-compat && npm test)
          node --test vendor/dsh-undo-savepoint/test/bundle-preflight.test.mjs
          node --test vendor/dsh-plugin-subscriptions/test/codex-custom*.test.mjs
          node --test scripts/tests/verified-runtime.test.mjs scripts/gen-model-catalog.test.mjs
          python3 scripts/inject-all.test.py
          node --test scripts/browser-overlay.test.mjs
          (cd dsh-client-ui-responsive && npm test)
      - name: Verify custom Codex credentials through the production Responses adapter
        run: |
          npm ci --ignore-scripts --no-audit --no-fund --prefix scripts/tests/codex-protocol-runtime
          npm run prepare-runtime --prefix scripts/tests/codex-protocol-runtime
          node scripts/tests/codex-custom-protocol.test.mjs
      - name: Read exact upstream source for contract gates
        shell: bash
        run: |
          set -euo pipefail
          revision=$(node -p "require('./scripts/contract.json').upstream.commit")
          git init dsh
          git -C dsh remote add origin https://github.com/deepseek-ai/deepseek-harness.git
          git -C dsh fetch --depth=1 origin "$revision"
          git -C dsh checkout --detach FETCH_HEAD
          tag=$(node -p "require('./scripts/contract.json').upstream.tag")
          git -C dsh fetch --depth=1 origin "refs/tags/$tag:refs/tags/$tag"
          test "$(git -C dsh rev-parse HEAD)" = "$revision"
      - name: Verify and download immutable runtime
        run: node scripts/fetch-verified-runtime.mjs --abi '${{ matrix.abi }}'
      - name: Run all Kotlin unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon --console=plain --max-workers=4
      - name: Inject this fork, run APK gates and build
        run: node scripts/build-apk.mjs --abi '${{ matrix.abi }}' --suffix "$APK_SUFFIX"
      - name: Verify APK signatures
        shell: bash
        run: |
          set -euo pipefail
          signer="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          expected=$(keytool -list -v -keystore keystore/debug.keystore -storepass android -alias androiddebugkey | sed -n 's/.*SHA256: *//p' | tr -d ':' | tr 'A-F' 'a-f')
          test -n "$expected"
          for apk in out/v*/*.apk; do
            "$signer" verify --verbose --print-certs "$apk" > "$apk.signature.txt"
            grep -i "$expected" "$apk.signature.txt"
            sha256sum "$apk" > "$apk.sha256"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: dsh-mobile-apk-${{ matrix.abi }}
          path: |
            out/v*/*.apk
            out/v*/*.sha256
            out/v*/*.signature.txt
            .deploy-tmp/snapshot-013/*/snapshot.tar.xz.source.json
            app/build/test-results/testDebugUnitTest/*.xml
          if-no-files-found: error
          retention-days: 30
